services:

  db:
    image: postgres:18
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file: .env
    networks:
      - frontend
      - backend
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    networks:
      - frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    stdin_open: true
    tty: true
    networks:
      - frontend
    depends_on:
      - nginx

volumes:
  postgres_data:

networks:
  frontend:
    driver: bridge
    name: app-frontend-network
  backend:
    driver: bridge
    name: app-backend-network
